name: Android Release

# Place this file at: .github/workflows/android-release.yml
# (in the root of the LiquidNotificationsTV repo, alongside build.gradle)

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v1.0.0 — push a tag to trigger a build + release
  workflow_dispatch:  # allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This project's zip did not include a committed gradlew script,
      # only gradle/wrapper/gradle-wrapper.properties (pointing at Gradle 7.6).
      # Rather than relying on a committed wrapper that may be missing/stale,
      # this step installs Gradle 7.6 directly and uses it to (re)generate the
      # wrapper if it's absent, then all subsequent steps use ./gradlew as normal.
      - name: Set up Gradle 7.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6'

      - name: Ensure gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in repo — generating it with Gradle 7.6"
            gradle wrapper --gradle-version 7.6
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK outputs
        id: apk
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ${{ steps.apk.outputs.debug_apk }}
            ${{ steps.apk.outputs.release_apk }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LiquidNotificationsTV ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.debug_apk }}
            ${{ steps.apk.outputs.release_apk }}
